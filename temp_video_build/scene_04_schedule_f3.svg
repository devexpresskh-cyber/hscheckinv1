<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  
  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="appHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="timelineDeepBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2a5e"/>
      <stop offset="50%" stop-color="#09224c"/>
      <stop offset="100%" stop-color="#071b38"/>
    </linearGradient>
    <linearGradient id="qrModalHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="emeraldBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgNavy)"/>

  
  <!-- Left Side: Step-by-Step Training Instruction Panel -->
  <g transform="translate(100, 140)">
    <!-- Module Badge -->
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="70" y="24" fill="#93c5fd" font-size="14" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">MODULE 03</text>

    <!-- Module Title -->
    <text x="0" y="75" fill="#ffffff" font-size="34" font-weight="900" font-family="Liberation Sans, sans-serif">Weekly Teaching Schedule</text>
    <text x="0" y="112" fill="#93c5fd" font-size="22" font-weight="bold" font-family="Liberation Sans, sans-serif">កាលវិភាគបង្រៀនប្រចាំសប្តាហ៍ និងប្រតិទិន Timeline ៧ថ្ងៃ</text>

    <!-- Steps Stack -->
    <g transform="translate(0, 140)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="760" height="135" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="50" cy="67" r="26" fill="#2563eb"/>
      <text x="50" y="75" fill="#ffffff" font-size="20" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">1</text>
      <text x="95" y="45" fill="#ffffff" font-size="20" font-weight="bold" font-family="Liberation Sans, sans-serif">Month Picker Header (e.g. January ∨)</text>
      <text x="95" y="75" fill="#93c5fd" font-size="15" font-family="Liberation Sans, sans-serif">Click on the Month dropdown to expand a mini monthly picker to jump to any date.</text>
      <text x="95" y="105" fill="#cbd5e1" font-size="13" font-family="Liberation Sans, sans-serif">ចុចលើឈ្មោះខែ (January ∨) ដើម្បីពន្លាតប្រតិទិនប្រចាំខែ និងជ្រើសថ្ងៃ</text>

      <!-- Step 2 -->
      <rect x="0" y="155" width="760" height="135" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="50" cy="222" r="26" fill="#2563eb"/>
      <text x="50" y="230" fill="#ffffff" font-size="20" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">2</text>
      <text x="95" y="200" fill="#ffffff" font-size="20" font-weight="bold" font-family="Liberation Sans, sans-serif">7-Day Strip Navigation (Mon - Sat)</text>
      <text x="95" y="230" fill="#93c5fd" font-size="15" font-family="Liberation Sans, sans-serif">Active day is highlighted with a prominent blue pill showing date numbers.</text>
      <text x="95" y="260" fill="#cbd5e1" font-size="13" font-family="Liberation Sans, sans-serif">របារថ្ងៃប្រចាំសប្តាហ៍ ៧ថ្ងៃ ជាមួយប៊ូតុងរំលេចពណ៌ខៀវលើថ្ងៃដែលបានជ្រើស</text>

      <!-- Step 3 -->
      <rect x="0" y="310" width="760" height="135" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="50" cy="377" r="26" fill="#2563eb"/>
      <text x="50" y="385" fill="#ffffff" font-size="20" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">3</text>
      <text x="95" y="355" fill="#ffffff" font-size="20" font-weight="bold" font-family="Liberation Sans, sans-serif">Deep Blue Timeline Class Event Cards</text>
      <text x="95" y="385" fill="#93c5fd" font-size="15" font-family="Liberation Sans, sans-serif">Each card shows bell time, period badge, subject title, room number and teacher avatar.</text>
      <text x="95" y="415" fill="#cbd5e1" font-size="13" font-family="Liberation Sans, sans-serif">កាតម៉ោងបង្រៀនបង្ហាញម៉ោងច្បាស់លាស់ មុខវិជ្ជា បន្ទប់រៀន និងរូបថតគ្រូ</text>

      <!-- Step 4 / Pro Tip -->
      <rect x="0" y="465" width="760" height="135" rx="18" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
      <circle cx="50" cy="532" r="26" fill="#10b981"/>
      <text x="50" y="540" fill="#ffffff" font-size="22" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">✓</text>
      <text x="95" y="510" fill="#34d399" font-size="20" font-weight="bold" font-family="Liberation Sans, sans-serif">Quick Options (...) Action Menu</text>
      <text x="95" y="540" fill="#a7f3d0" font-size="15" font-family="Liberation Sans, sans-serif">Tap the three dots on any class card to inspect session details or view classroom map.</text>
      <text x="95" y="570" fill="#e2e8f0" font-size="13" font-family="Liberation Sans, sans-serif">ចុចសញ្ញាចុចបី (...) លើកាតនីមួយៗដើម្បីមើលព័ត៌មានលម្អិត និងទីតាំងបន្ទប់</text>
    </g>
  </g>
  

  <!-- Right: Real Weekly Timeline UI -->
  <g transform="translate(1000, 100)">
    <rect width="520" height="880" rx="36" fill="#071b38" stroke="#1e3a8a" stroke-width="2" filter="url(#softShadow)"/>

    <!-- Header Bar -->
    <rect width="520" height="74" rx="36" fill="#0b2a5e"/>
    <text x="25" y="44" fill="#ffffff" font-size="20" font-weight="900" font-family="Liberation Sans, sans-serif">January 2026 ∨</text>

    <!-- 7 Day Strip -->
    <g transform="translate(20, 90)">
      
          <g transform="translate(0, 0)">
            <rect width="72" height="64" rx="16" fill="#0f274a" stroke="#1e3a8a" stroke-width="1"/>
            <text x="36" y="28" fill="#94a3b8" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Mon</text>
            <text x="36" y="50" fill="#cbd5e1" font-size="16" font-weight="900" font-family="Liberation Sans, sans-serif" text-anchor="middle">12</text>
          </g>
        
          <g transform="translate(80, 0)">
            <rect width="72" height="64" rx="16" fill="#0f274a" stroke="#1e3a8a" stroke-width="1"/>
            <text x="36" y="28" fill="#94a3b8" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Tue</text>
            <text x="36" y="50" fill="#cbd5e1" font-size="16" font-weight="900" font-family="Liberation Sans, sans-serif" text-anchor="middle">13</text>
          </g>
        
          <g transform="translate(160, 0)">
            <rect width="72" height="64" rx="16" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
            <text x="36" y="28" fill="#ffffff" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Wed</text>
            <text x="36" y="50" fill="#ffffff" font-size="16" font-weight="900" font-family="Liberation Sans, sans-serif" text-anchor="middle">14</text>
          </g>
        
          <g transform="translate(240, 0)">
            <rect width="72" height="64" rx="16" fill="#0f274a" stroke="#1e3a8a" stroke-width="1"/>
            <text x="36" y="28" fill="#94a3b8" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Thu</text>
            <text x="36" y="50" fill="#cbd5e1" font-size="16" font-weight="900" font-family="Liberation Sans, sans-serif" text-anchor="middle">15</text>
          </g>
        
          <g transform="translate(320, 0)">
            <rect width="72" height="64" rx="16" fill="#0f274a" stroke="#1e3a8a" stroke-width="1"/>
            <text x="36" y="28" fill="#94a3b8" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Fri</text>
            <text x="36" y="50" fill="#cbd5e1" font-size="16" font-weight="900" font-family="Liberation Sans, sans-serif" text-anchor="middle">16</text>
          </g>
        
          <g transform="translate(400, 0)">
            <rect width="72" height="64" rx="16" fill="#0f274a" stroke="#1e3a8a" stroke-width="1"/>
            <text x="36" y="28" fill="#94a3b8" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Sat</text>
            <text x="36" y="50" fill="#cbd5e1" font-size="16" font-weight="900" font-family="Liberation Sans, sans-serif" text-anchor="middle">17</text>
          </g>
        
    </g>

    <!-- Timeline Event Cards -->
    <g transform="translate(20, 180)">
      <!-- Class 1 -->
      <g transform="translate(0, 0)">
        <rect width="480" height="150" rx="22" fill="#1e40af" stroke="#60a5fa" stroke-width="3" filter="url(#cardShadow)"/>
        <rect x="18" y="18" width="110" height="30" rx="10" fill="#2563eb"/>
        <text x="73" y="38" fill="#ffffff" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">08:00 - 09:30</text>
        <rect x="360" y="18" width="100" height="30" rx="10" fill="#10b981" fill-opacity="0.3"/>
        <text x="410" y="38" fill="#34d399" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Room 304</text>
        <text x="18" y="80" fill="#ffffff" font-size="18" font-weight="900" font-family="Liberation Sans, sans-serif">CS-201 Data Structures &amp; Algorithms</text>
        <text x="18" y="105" fill="#93c5fd" font-size="13" font-family="Liberation Sans, sans-serif">Faculty: Dr. Sovann Vichea • Year 2 Semester 1</text>
        <text x="18" y="130" fill="#34d399" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif">● Active Class for Wednesday</text>
      </g>

      <!-- Class 2 -->
      <g transform="translate(0, 170)">
        <rect width="480" height="150" rx="22" fill="#0b2a5e" stroke="#1d4ed8" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="18" y="18" width="110" height="30" rx="10" fill="#334155"/>
        <text x="73" y="38" fill="#cbd5e1" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">10:00 - 11:30</text>
        <rect x="360" y="18" width="100" height="30" rx="10" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="410" y="38" fill="#60a5fa" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">Lab 2</text>
        <text x="18" y="80" fill="#ffffff" font-size="18" font-weight="900" font-family="Liberation Sans, sans-serif">CS-305 Database Systems</text>
        <text x="18" y="105" fill="#93c5fd" font-size="13" font-family="Liberation Sans, sans-serif">Faculty: Dr. Sovann Vichea • Year 3 Semester 1</text>
      </g>
    </g>
  </g>

  
  <!-- Animated Action Cursor Overlay -->
  <g transform="translate(1240, 420)">
    
      <circle cx="0" cy="0" r="34" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>
      <circle cx="0" cy="0" r="18" fill="#38bdf8" fill-opacity="0.3"/>
    
    <path d="M 0 0 L 0 28 L 7 21 L 15 32 L 19 30 L 11 19 L 21 19 Z" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#softShadow)"/>
    
      <rect x="24" y="-12" width="144" height="28" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="96" y="7" fill="#38bdf8" font-size="12" font-weight="bold" font-family="Liberation Sans, sans-serif" text-anchor="middle">CS-201 Room 304</text>
    
  </g>
  
</svg>